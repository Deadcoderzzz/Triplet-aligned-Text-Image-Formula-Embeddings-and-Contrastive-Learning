model:
  text_encoder: "scibert_scivocab_uncased"
  image_encoder: "ViT-B-32"
  formula_encoder: "MathBERT"
  embedding_dim: 512
  use_adaptive_fusion: true
  modality_dropout: 0.1

# Training Configuration
training:
  optimizer: "AdamW"
  learning_rate: 2.0e-5
  weight_decay: 0.01
  batch_size: 32
  epochs: 400
  warmup_ratio: 0.1
  scheduler: "cosine"
  gradient_clip: 1.0
  early_stopping_patience: 20
  
  # Multi-GPU
  num_gpus: 2
  distributed: false

# Loss Function
loss:
  lambda_pair: 0.6
  lambda_triplet: 0.4
  temperature: 0.07

# Data Processing
data:
  max_text_length: 512
  max_formula_length: 256
  image_size: 224
  num_workers: 4

# Evaluation
evaluation:
  similarity_threshold: 0.5
  batch_size: 16
  recall_k_values: [1, 5, 10, 20, 50]

# Logging
logging:
  use_wandb: true
  wandb_project: "tif-contrast"
  log_interval: 10
  checkpoint_interval: 50

# Paths
paths:
  data_root: "data"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  visualizations_dir: "visualizations"
